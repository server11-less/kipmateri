  <script>
    (() => {
      const serverTheme = new URLSearchParams(window.location.search).get('theme') || '';
      let saved = '';
      try { saved = localStorage.getItem('kipTheme') || ''; } catch (_) {}
      const preferred = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme =
        saved === 'dark' || saved === 'light' ? saved :
        serverTheme === 'dark' || serverTheme === 'light' ? serverTheme : preferred;
    })();
  </script>
  <style>
    :root{--navy:#0b2f6b;--navy2:#154581;--red:#cf0a2c;--bg:#f5f7fb;--card:#fff;--text:#172238;--muted:#718096;--line:#e3e9f2;--green:#11966a;--amber:#d8890b;--danger:#b4233b;--shadow:0 12px 32px rgba(11,47,107,.08)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .topbar{position:sticky;top:0;z-index:30;height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 22px}.brand{display:flex;align-items:center;gap:11px;color:var(--navy);font-weight:950}.brand-logo-wrap{width:64px;height:48px;border-radius:10px;background:#fff;border:1px solid rgba(11,47,107,.10);display:grid;place-items:center;overflow:hidden;flex:0 0 auto}.brand-logo{display:block;width:100%;height:100%;object-fit:contain}.brand-title{display:block;font-weight:950;letter-spacing:-.02em}.brand small{display:block;color:var(--red);font-size:9px;letter-spacing:.10em;margin-top:1px}.top-actions{display:flex;align-items:center;gap:8px}.user{font-size:11px;color:var(--navy);font-weight:850;padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:#fff}
    .btn{border:0;border-radius:11px;padding:9px 12px;font-weight:850;transition:.15s}.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}.primary{background:var(--red);color:#fff}.soft{background:#edf3fc;color:var(--navy)}.outline{background:#fff;color:var(--navy);border:1px solid #ced8e8}.btn-sm{padding:7px 9px;font-size:11px}
    .shell{max-width:1480px;margin:0 auto;padding:22px 22px 46px}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:18px}.eyebrow{font-size:10px;font-weight:950;letter-spacing:.15em;color:var(--red);text-transform:uppercase}.hero h1{margin:5px 0 6px;color:var(--navy);font-size:31px;letter-spacing:-.035em}.hero p{margin:0;color:var(--muted);font-size:12px}.week{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 13px;box-shadow:0 6px 18px rgba(11,47,107,.05)}.week span{display:block;font-size:9px;font-weight:900;letter-spacing:.08em;color:var(--red);text-transform:uppercase}.week strong{display:block;color:var(--navy);margin-top:2px;font-size:13px}
    .summary{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:10px;margin-bottom:15px}.metric{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px}.metric span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:900}.metric strong{display:block;margin-top:4px;font-size:23px;color:var(--navy)}
    .workspace{display:grid;grid-template-columns:minmax(320px,.9fr) minmax(480px,1.4fr);gap:15px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.levels-panel{padding:15px;position:sticky;top:90px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:11px}.panel-head h2,.panel-head h3{margin:0;color:var(--navy);font-size:17px}.search{width:100%;border:1px solid var(--line);border-radius:11px;padding:9px 10px;outline:none;margin-bottom:10px}.search:focus{border-color:#7893bd;box-shadow:0 0 0 3px rgba(11,47,107,.07)}
    .level-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.level-card{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left;transition:.16s;position:relative;overflow:hidden}.level-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red);transform:scaleY(0);transition:.16s}.level-card:hover{transform:translateY(-1px);border-color:#c9d5e7;box-shadow:0 8px 18px rgba(11,47,107,.06)}.level-card.active{border-color:#9eb2d0;background:#f8fbff}.level-card.active:before{transform:scaleY(1)}.level-card strong{display:block;color:var(--navy);font-size:12px;line-height:1.3}.level-card small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.progress-row{display:flex;gap:4px;margin-top:9px}.dot{width:9px;height:9px;border-radius:50%;background:#e6ebf2}.dot.on{background:var(--green)}.count{position:absolute;right:10px;top:10px;font-size:9px;font-weight:950;color:var(--green);background:#eaf8f2;padding:4px 6px;border-radius:999px}
    .editor-panel{min-height:520px}.editor-empty{min-height:520px;display:grid;place-items:center;text-align:center;padding:38px;color:var(--muted)}.empty-icon{width:72px;height:72px;border-radius:22px;background:#edf3fc;color:var(--navy);display:grid;place-items:center;margin:0 auto 13px;font-size:28px}.editor{animation:in .24s cubic-bezier(.2,.8,.2,1)}.editor-head{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.editor-head h2{margin:3px 0 4px;color:var(--navy);font-size:20px}.meta{font-size:10px;color:var(--muted);line-height:1.45}.pill{font-size:9px;font-weight:950;padding:5px 8px;border-radius:999px;background:#edf3fc;color:var(--navy)}.editor-body{padding:17px}.notice{padding:10px 12px;border-radius:11px;background:#fff8ea;color:#8b5a08;border:1px solid #f1dfb8;font-size:10px;line-height:1.45;margin-bottom:12px}
    .day-list{display:grid;gap:9px}.day-row{border:1px solid var(--line);border-radius:13px;padding:11px;display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:10px;align-items:center;transition:.15s}.day-row:focus-within{border-color:#9fb2cf;box-shadow:0 0 0 3px rgba(11,47,107,.05)}.day-name{font-size:11px;font-weight:950;color:var(--navy)}.day-date{font-size:9px;color:var(--muted);margin-top:2px}.link-input{width:100%;border:1px solid #d8e0eb;border-radius:10px;padding:9px 10px;outline:none}.link-input:focus{border-color:#7893bd}.link-input.invalid{border-color:#d98b99;background:#fff7f8}.day-actions{display:flex;gap:6px;align-items:center}.status{font-size:9px;font-weight:900;padding:5px 7px;border-radius:999px;background:#f2f4f7;color:#7b8493;white-space:nowrap}.status.linked{background:#eaf8f2;color:var(--green)}.open{border:0;background:#edf3fc;color:var(--navy);border-radius:9px;padding:7px 8px;font-size:10px;font-weight:900;text-decoration:none;white-space:nowrap}
    .editor-foot{padding:14px 17px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border-radius:0 0 18px 18px}.dirty{font-size:10px;color:var(--amber);font-weight:850}.saved{color:var(--green)}
    .loading,.error{padding:42px;text-align:center;background:#fff;border:1px dashed #ccd7e7;border-radius:18px;color:var(--muted)}.error{color:var(--danger);background:#fff8f9;border-color:#efc7cf}.spinner{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .65s linear infinite;vertical-align:-3px;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .toast{position:fixed;right:18px;bottom:18px;z-index:100;background:#172238;color:#fff;border-radius:12px;padding:11px 14px;font-size:12px;font-weight:800;box-shadow:0 12px 32px rgba(0,0,0,.18);max-width:360px}.toast.error{background:var(--danger)}

<script>
/* ============================================================
 * KIP GITHUB -> GOOGLE APPS SCRIPT RPC CLIENT — repaired v2
 *
 * GitHub Pages cannot use native google.script.run directly.
 * This compatibility client POSTs to the GAS Web App in a hidden iframe,
 * then receives the result through window.postMessage.
 * ============================================================ */
const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzsz4qbWwgqbnURyM3MLQMw2ayMYJrUe1kj2zfEepR7Oeo0rrfSH_H1K9fql4XAMJuw/exec';

(function installKipGasRpcClient(){
  'use strict';

  const REQUEST_TIMEOUT_MS = 30000;
  const pending = new Map();
  let sequence = 0;

  function backendUrl(){
    const value = String(GAS_WEB_APP_URL || '').trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec(?:\?.*)?$/i.test(value)) {
      throw new Error('GAS_WEB_APP_URL is not a valid deployed Apps Script /exec URL.');
    }
    return value.split('?')[0];
  }

  function normalizeError(error){
    if (error instanceof Error) return error;
    const message = error && error.message
      ? String(error.message)
      : String(error || 'Unknown Apps Script error');
    const out = new Error(message);
    if (error && error.name) out.name = String(error.name);
    return out;
  }

  function randomNonce(){
    try {
      if (window.crypto && typeof window.crypto.getRandomValues === 'function') {
        const bytes = new Uint32Array(4);
        window.crypto.getRandomValues(bytes);
        return Array.from(bytes, value => value.toString(36)).join('');
      }
    } catch (_) {}
    return Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  function hiddenInput(name, value){
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = name;
    input.value = value == null ? '' : String(value);
    return input;
  }

  function cleanupTask(task){
    if (!task) return;
    clearTimeout(task.timer);
    if (task.form && task.form.parentNode) task.form.parentNode.removeChild(task.form);
    if (task.frame && task.frame.parentNode) task.frame.parentNode.removeChild(task.frame);
  }

  function rpc(method, args, success, failure, userObject){
    let url;
    try {
      url = backendUrl();
    } catch (error) {
      if (typeof failure === 'function') failure(normalizeError(error), userObject);
      return;
    }

    const id = 'kiprpc_' + Date.now().toString(36) + '_' + (++sequence).toString(36);
    const nonce = randomNonce();
    const frameName = 'kip_rpc_frame_' + id.replace(/[^A-Za-z0-9_]/g, '_');
    const mount = document.body || document.documentElement;

    const frame = document.createElement('iframe');
    frame.name = frameName;
    frame.title = 'KIP Apps Script request';
    frame.setAttribute('aria-hidden', 'true');
    frame.tabIndex = -1;
    frame.style.cssText = 'position:fixed;width:1px;height:1px;left:-10000px;top:-10000px;border:0;opacity:0;pointer-events:none;';

    const form = document.createElement('form');
    form.method = 'POST';
    form.action = url;
    form.target = frameName;
    form.acceptCharset = 'UTF-8';
    form.enctype = 'application/x-www-form-urlencoded';
    form.style.display = 'none';
    form.appendChild(hiddenInput('kipRpc', '1'));
    form.appendChild(hiddenInput('method', String(method || '')));
    form.appendChild(hiddenInput('args', JSON.stringify(Array.isArray(args) ? args : [])));
    form.appendChild(hiddenInput('requestId', id));
    form.appendChild(hiddenInput('nonce', nonce));
    form.appendChild(hiddenInput('origin', window.location.origin));

    const timer = setTimeout(() => {
      const task = pending.get(id);
      if (!task) return;
      pending.delete(id);
      cleanupTask(task);
      const error = new Error('Apps Script request timed out. Confirm the /exec deployment is current and accessible to the intended users.');
      error.name = 'KipRpcTimeoutError';
      if (typeof task.failure === 'function') task.failure(error, task.userObject);
    }, REQUEST_TIMEOUT_MS);

    const task = { id, nonce, frame, form, timer, success, failure, userObject };
    pending.set(id, task);

    try {
      mount.appendChild(frame);
      mount.appendChild(form);
      form.submit();
      setTimeout(() => {
        if (form.parentNode) form.parentNode.removeChild(form);
      }, 0);
    } catch (error) {
      pending.delete(id);
      cleanupTask(task);
      if (typeof failure === 'function') failure(normalizeError(error), userObject);
    }
  }

  function createRunner(success, failure, userObject){
    return new Proxy({}, {
      get(_target, property){
        if (property === 'withSuccessHandler') {
          return handler => createRunner(handler, failure, userObject);
        }
        if (property === 'withFailureHandler') {
          return handler => createRunner(success, handler, userObject);
        }
        if (property === 'withUserObject') {
          return value => createRunner(success, failure, value);
        }
        if (property === 'then') return undefined;
        return function(){
          rpc(
            String(property),
            Array.prototype.slice.call(arguments),
            result => { if (typeof success === 'function') success(result, userObject); },
            error => { if (typeof failure === 'function') failure(error, userObject); },
            userObject
          );
        };
      }
    });
  }

  function isTrustedGasMessageOrigin(origin){
    try {
      const url = new URL(String(origin || ''));
      if (url.protocol !== 'https:') return false;
      const host = url.hostname.toLowerCase();
      return host === 'script.google.com' ||
        host === 'script.googleusercontent.com' ||
        /(^|[.-])script\.googleusercontent\.com$/.test(host);
    } catch (_) {
      return false;
    }
  }

  window.addEventListener('message', function(event){
    const data = event.data || {};
    if (data.type !== 'KIP_GAS_RPC_RESULT' || !data.id || !data.nonce) return;
    if (!isTrustedGasMessageOrigin(event.origin)) return;

    const task = pending.get(String(data.id));
    if (!task || String(data.nonce) !== task.nonce) return;

    pending.delete(task.id);
    cleanupTask(task);

    if (data.ok) {
      if (typeof task.success === 'function') task.success(data.result, task.userObject);
      return;
    }

    const error = normalizeError(data.error || 'Apps Script request failed.');
    if (typeof task.failure === 'function') task.failure(error, task.userObject);
  });

  window.google = window.google || {};
  window.google.script = window.google.script || {};
  Object.defineProperty(window.google.script, 'run', {
    configurable: true,
    get(){ return createRunner(null, null, null); }
  });

  window.KIP_RPC = Object.freeze({
    backendUrl: () => backendUrl(),
    pendingCount: () => pending.size
  });
})();
</script>

    <div class="top-actions"><button id="themeToggle" class="btn soft btn-sm theme-btn" type="button">🌙 Dark</button><div id="userChip" class="user">Material Maker</div><button id="refreshBtn" class="btn soft btn-sm">↻ Refresh</button><button id="logoutBtn" class="btn outline btn-sm">Logout</button></div>
  </header>
  <main class="shell">
    <div id="app"><div class="loading"><span class="spinner"></span>Loading Material Maker…</div></div>
  </main>
  <div id="toast" class="toast hidden"></div>

  <script>
    const SERVER_APP_URL = new URL('index.html', window.location.href).href.split('?')[0];
    const tokenQuery = new URLSearchParams(window.location.search);
    const legacyQueryToken = tokenQuery.get('token') || '';
    const INITIAL_TOKEN = (()=>{try{return localStorage.getItem('kipStaffToken')||sessionStorage.getItem('kipStaffToken')||legacyQueryToken||'';}catch(_){return legacyQueryToken;}})();
    if (legacyQueryToken) {
      try {
        tokenQuery.delete('token');
        const cleanQuery = tokenQuery.toString();
        history.replaceState(null,'',window.location.pathname+(cleanQuery?'?'+cleanQuery:'')+window.location.hash);
      } catch (_) {}
    }
    const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday'];
    const state = { token:INITIAL_TOKEN, data:null, selectedLevelId:'', original:{}, dirty:false };

    const THEME_KEY='kipTheme';
    function currentTheme(){return document.documentElement.dataset.theme==='dark'?'dark':'light';}
    function applyTheme(theme,persist=true){
      const next=theme==='dark'?'dark':'light';
      document.documentElement.dataset.theme=next;
      if(persist){try{localStorage.setItem(THEME_KEY,next);}catch(_){}}
      updateThemeButton();
    }
    function toggleTheme(){applyTheme(currentTheme()==='dark'?'light':'dark');}
    function updateThemeButton(){
      const b=document.getElementById('themeToggle');if(!b)return;
      const dark=currentTheme()==='dark';
      b.innerHTML=dark?'<span class="theme-icon">☀️</span><span class="theme-text">Light</span>':'<span class="theme-icon">🌙</span><span class="theme-text">Dark</span>';
      b.setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme');
    }

    window.addEventListener('error', event => {
      const app = document.getElementById('app');
      if (app && !app.querySelector('.error')) {
        app.innerHTML = `<div class="error"><strong>Dashboard could not start.</strong><div style="margin-top:7px">${esc(event.message || 'Unexpected browser error.')}</div><button id="fatalLogin" class="btn primary" style="margin-top:14px">Return to Login</button></div>`;
        document.getElementById('fatalLogin')?.addEventListener('click', loadLoginSurface);
      }
    });

    function start(){
      document.getElementById('themeToggle')?.addEventListener('click',toggleTheme);
      updateThemeButton();
      document.getElementById('refreshBtn')?.addEventListener('click',()=>{if(confirmDirty())loadWorkspace(state.selectedLevelId);});
      document.getElementById('logoutBtn')?.addEventListener('click',logout);
      if (!state.token) return showSessionExpired('No valid staff session was provided.');
      loadWorkspace();
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();

    function loadWorkspace(keepLevel=''){
      document.getElementById('app').innerHTML='<div class="loading"><span class="spinner"></span>Loading active-week materials…</div>';
      google.script.run.withSuccessHandler(data=>{
        state.data=data;state.selectedLevelId=keepLevel&&data.levels.some(x=>x.levelId===keepLevel)?keepLevel:'';state.dirty=false;state.original={};
        document.getElementById('userChip').textContent=`${data.user?.username||'Material Maker'} · Material Maker`;
        renderWorkspace();
        if(state.selectedLevelId)selectLevel(state.selectedLevelId,false);
      }).withFailureHandler(handleAuthFailure).getMaterialMakerWorkspace(state.token);
    }
    function handleAuthFailure(error){clearSession();showSessionExpired(errorText(error));}
    function logout(){if(state.token)google.script.run.logoutStaff(state.token);clearSession();loadLoginSurface();}
    function clearSession(){['kipStaffToken','kipStaffUser'].forEach(k=>{try{localStorage.removeItem(k);}catch(_){} try{sessionStorage.removeItem(k);}catch(_){}});}
    function loadLoginSurface(){window.top.location.href=(SERVER_APP_URL||window.location.href.split('?')[0])+'?page=login&theme='+encodeURIComponent(currentTheme());}
    function showSessionExpired(message){
      const app=document.getElementById('app');
      if(app) app.innerHTML=`<div class="error"><strong>Staff session unavailable.</strong><div style="margin-top:7px">${esc(message||'Please login again.')}</div><button id="returnLogin" class="btn primary" style="margin-top:14px">Return to Login</button></div>`;
      document.getElementById('returnLogin')?.addEventListener('click',loadLoginSurface);
    }

    function renderWorkspace(){
      const d=state.data||{},levels=d.levels||[],total=levels.length,linked=levels.reduce((s,x)=>s+x.filledDays,0),complete=levels.filter(x=>x.filledDays===5).length,w=d.activeWeek||{};
      document.getElementById('app').innerHTML=`<section class="hero"><div><div class="eyebrow">Material Team</div><h1>Weekly Material Links</h1><p>Choose a level, paste Google Drive links for Monday-Friday, then save once.</p></div><div class="week"><span>Admin Active Week</span><strong>${prettyDate(w.weekStart)} — ${prettyDate(w.weekEnd)}</strong></div></section><section class="summary"><div class="metric"><span>Active Levels</span><strong>${total}</strong></div><div class="metric"><span>Linked Days</span><strong>${linked}/${total*5}</strong></div><div class="metric"><span>Complete Levels</span><strong>${complete}/${total}</strong></div></section><section class="workspace"><div class="panel levels-panel"><div class="panel-head"><h2>Choose Level</h2><span class="pill">${total} levels</span></div><input id="levelSearch" class="search" placeholder="Search level…"><div id="levelGrid" class="level-grid"></div></div><div id="editorPanel" class="panel editor-panel"><div class="editor-empty"><div><div class="empty-icon">↗</div><strong style="color:var(--navy)">Select a level</strong><div class="meta" style="margin-top:6px">Its five active-week links will appear here automatically.</div></div></div></div></section>`;
      document.getElementById('levelSearch').addEventListener('input',renderLevelGrid);renderLevelGrid();
    }

    function renderLevelGrid(){
      const target=document.getElementById('levelGrid');if(!target)return;const q=(document.getElementById('levelSearch')?.value||'').trim().toLowerCase();const levels=(state.data?.levels||[]).filter(x=>!q||`${x.levelName} ${x.levelId}`.toLowerCase().includes(q));
      target.innerHTML=levels.length?levels.map(l=>`<button class="level-card ${l.levelId===state.selectedLevelId?'active':''}" data-level="${attr(l.levelId)}"><span class="count">${l.filledDays}/5</span><strong>${esc(l.levelName)}</strong><small>${esc(l.levelId)}</small><div class="progress-row">${l.days.map(x=>`<span class="dot ${x.link?'on':''}"></span>`).join('')}</div></button>`).join(''):'<div class="meta">No levels found.</div>';
      target.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>selectLevel(b.dataset.level,true)));
    }

    function selectLevel(levelId,checkDirty=true){
      if(checkDirty&&levelId!==state.selectedLevelId&&!confirmDirty())return;const level=(state.data?.levels||[]).find(x=>x.levelId===levelId);if(!level)return;state.selectedLevelId=levelId;state.dirty=false;state.original=Object.fromEntries(level.days.map(x=>[x.day,x.link||'']));renderLevelGrid();renderEditor(level);
    }
    function confirmDirty(){return !state.dirty||confirm('You have unsaved material links. Discard the changes?');}

    function renderEditor(level){
      const panel=document.getElementById('editorPanel'),weekStart=state.data?.activeWeek?.weekStart||'';
      panel.innerHTML=`<div class="editor"><div class="editor-head"><div><div class="eyebrow">${esc(level.levelId)}</div><h2>${esc(level.levelName)}</h2><div class="meta">Titles are generated automatically as “${esc(level.levelName)} - Day”.</div></div><span class="pill">${level.filledDays}/5 linked</span></div><div class="editor-body"><div class="notice"><strong>Blank = no material.</strong> Clearing an existing field will make that day inactive when you save. Only Google Drive links are accepted.</div><div class="day-list">${level.days.map((slot,i)=>dayRow(slot,i,weekStart)).join('')}</div></div><div class="editor-foot"><div id="dirtyState" class="dirty saved">No unsaved changes</div><button id="saveWeek" class="btn primary">Save Week Materials</button></div></div>`;
      panel.querySelectorAll('.link-input').forEach(input=>input.addEventListener('input',onLinkInput));document.getElementById('saveWeek').addEventListener('click',saveWeek);refreshDayStates();
    }
    function dayRow(slot,index,weekStart){
      const date=addDaysText(weekStart,index);return`<div class="day-row" data-day-row="${attr(slot.day)}"><div><div class="day-name">${esc(slot.day)}</div><div class="day-date">${esc(date)}</div></div><input class="link-input" data-day="${attr(slot.day)}" value="${attr(slot.link||'')}" placeholder="https://drive.google.com/..."><div class="day-actions"><span class="status">Empty</span><a class="open hidden" target="_blank" rel="noopener noreferrer">Open ↗</a></div></div>`;
    }
    function onLinkInput(){
      state.dirty=DAYS.some(day=>{const v=document.querySelector(`.link-input[data-day="${day}"]`)?.value.trim()||'';return v!==(state.original[day]||'');});refreshDayStates();const d=document.getElementById('dirtyState');if(d){d.textContent=state.dirty?'Unsaved changes':'No unsaved changes';d.className='dirty'+(state.dirty?'':' saved');}
    }
    function refreshDayStates(){
      document.querySelectorAll('.link-input').forEach(input=>{const row=input.closest('.day-row'),status=row.querySelector('.status'),open=row.querySelector('.open'),v=input.value.trim(),valid=!v||isDrive(v);input.classList.toggle('invalid',!valid);status.textContent=v?(valid?'Linked':'Invalid link'):'Empty';status.className='status'+(v&&valid?' linked':'');if(v&&valid){open.href=v;open.classList.remove('hidden');}else{open.removeAttribute('href');open.classList.add('hidden');}});
    }
    function saveWeek(){
      const level=(state.data?.levels||[]).find(x=>x.levelId===state.selectedLevelId);if(!level)return;const items=DAYS.map(day=>({day,link:document.querySelector(`.link-input[data-day="${day}"]`)?.value.trim()||''}));const invalid=items.find(x=>x.link&&!isDrive(x.link));if(invalid)return toast(`${invalid.day}: use a valid Google Drive link.`,true);const btn=document.getElementById('saveWeek');busy(btn,true,'Saving…');google.script.run.withSuccessHandler(result=>{toast(`${result.levelName} saved for the active week.`);loadWorkspace(state.selectedLevelId);}).withFailureHandler(e=>{busy(btn,false,'Save Week Materials');toast(errorText(e),true);}).saveMaterialWeekLinks(state.token,{levelId:level.levelId,items});
    }

    function isDrive(v){return /^https:\/\/drive\.google\.com\//i.test(String(v||'').trim());}
    function addDaysText(start,days){if(!start)return'';const d=new Date(start+'T00:00:00');d.setDate(d.getDate()+days);return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
    function prettyDate(v){if(!v)return'-';const d=new Date(String(v).slice(0,10)+'T00:00:00');return isNaN(d)?String(v):d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
    function busy(btn,on,text){if(!btn)return;btn.disabled=on;btn.innerHTML=on?`<span class="spinner"></span>${esc(text)}`:esc(text);}
    let toastTimer;function toast(msg,error=false){const t=document.getElementById('toast');clearTimeout(toastTimer);t.textContent=msg;t.className='toast'+(error?' error':'');toastTimer=setTimeout(()=>t.classList.add('hidden'),3000);}
    function errorText(e){return e?.message||String(e||'Unknown error');}
    function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}function attr(v){return esc(v);}
  </script>
</body>
</html>
