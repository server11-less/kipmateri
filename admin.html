<!DOCTYPE html>
<!--
  KIP GitHub Frontend
  SETUP: replace PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE below with the same deployed /exec URL in all 3 HTML files.
  Backend remains in Code.gs. No external JS/CSS files are required.
-->

<html data-server-theme="">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>Admin Control Center - Kampung Inggris Pontianak</title>
  <link id="appFavicon" rel="icon" href="">
  <style>
    :root{
      --navy:#0b2f6b;
      --navy2:#154581;
      --red:#cf0a2c;
      --bg:#f4f7fb;
      --surface:#ffffff;
      --surface2:#f8faff;
      --surface3:#edf3fb;
      --text:#172238;
      --muted:#718096;
      --line:#dfe7f1;
      --green:#11966a;
      --amber:#d8890b;
      --danger:#b4233b;
      --glass:rgba(255,255,255,.88);
      --dock:rgba(255,255,255,.90);
      --shadow:0 18px 48px rgba(11,47,107,.10);
      --shadow-soft:0 8px 24px rgba(11,47,107,.07);
    }
    html[data-theme="dark"]{
      --navy:#9ac0ff;
      --navy2:#c2d9ff;
      --red:#ff637c;
      --bg:#08111f;
      --surface:#101b2d;
      --surface2:#142238;
      --surface3:#1b2b45;
      --text:#eef4ff;
      --muted:#9aa9bf;
      --line:#2a3b54;
      --green:#45d3a2;
      --amber:#f2b75b;
      --danger:#ff7d91;
      --glass:rgba(8,17,31,.90);
      --dock:rgba(16,27,45,.94);
      --shadow:0 20px 55px rgba(0,0,0,.30);
      --shadow-soft:0 9px 25px rgba(0,0,0,.20);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
    body{position:relative;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;z-index:-2;background:var(--bg)}
    #watermark{position:fixed;z-index:-1;left:50%;top:54%;width:min(560px,58vw);max-width:72vw;transform:translate(-50%,-50%);opacity:.026;pointer-events:none;filter:saturate(.85)}
    html[data-theme="dark"] #watermark{opacity:.042;filter:grayscale(.15) brightness(1.20)}
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer}
    .hidden{display:none!important}
    #root{min-height:100vh;padding-bottom:118px}
    .page{max-width:1500px;margin:0 auto;padding:22px 26px 42px}
    .topbar{position:sticky;top:12px;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:11px 13px 11px 15px;margin-bottom:24px;background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(20px);box-shadow:var(--shadow-soft)}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .brand-logo{width:72px;height:48px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:13px;padding:3px;flex:0 0 auto}
    .brand-copy{min-width:0}
    .brand-copy strong{display:block;color:var(--navy);font-size:14px}
    .brand-copy span{display:block;color:var(--muted);font-size:9px;letter-spacing:.13em;font-weight:850;margin-top:2px;white-space:nowrap}
    .top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .user-chip{display:flex;align-items:center;gap:8px;padding:8px 11px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-size:11px;font-weight:800}
    .user-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(17,150,106,.12)}
    .hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:0 2px 22px;animation:rise .28s ease}
    .eyebrow{font-size:10px;font-weight:950;letter-spacing:.15em;color:var(--red);text-transform:uppercase}
    .hero h1{margin:5px 0 6px;color:var(--navy);font-size:34px;line-height:1.05;letter-spacing:-.04em}
    .hero p{margin:0;color:var(--muted);font-size:13px;max-width:720px;line-height:1.55}
    .week-pill{padding:10px 13px;background:var(--surface);border:1px solid var(--line);border-radius:13px;font-size:11px;font-weight:850;color:var(--navy);box-shadow:var(--shadow-soft);white-space:nowrap}
    .btn{border:0;border-radius:12px;padding:9px 13px;font-weight:850;transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
    .btn:hover{transform:translateY(-1px)}
    .btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
    .btn.primary{background:var(--red);color:#fff;box-shadow:0 8px 18px rgba(207,10,44,.18)}
    .btn.soft{background:var(--surface3);color:var(--navy)}
    .btn.outline{background:var(--surface);color:var(--navy);border:1px solid var(--line)}
    .btn.danger{background:rgba(180,35,59,.08);color:var(--danger);border:1px solid rgba(180,35,59,.20)}
    .btn-sm{padding:7px 10px;font-size:11px}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow-soft)}
    .badge{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;background:var(--surface3);color:var(--navy);font-size:9px;font-weight:950}
    .badge.green{background:rgba(17,150,106,.11);color:var(--green)}
    .badge.red{background:rgba(207,10,44,.09);color:var(--red)}
    .badge.gray{background:rgba(113,128,150,.10);color:var(--muted)}
    .badge.amber{background:rgba(216,137,11,.11);color:var(--amber)}
    .meta{font-size:11px;color:var(--muted);line-height:1.45}
    .link{color:var(--navy);font-weight:850;text-decoration:none}
    .section-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
    .section-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .search{min-width:240px;max-width:420px;width:min(420px,100%);border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);outline:none}
    .search:focus,.control:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(11,47,107,.08)}
    .breadcrumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px}
    .crumb{border:0;background:var(--surface3);color:var(--navy);border-radius:10px;padding:7px 9px;font-size:10px;font-weight:850}
    .crumb.current{background:transparent;color:var(--muted);cursor:default}
    .crumb-sep{color:var(--muted);font-size:10px}
    .selection-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}
    .select-card{position:relative;text-align:left;padding:18px;border:1px solid var(--line);border-radius:19px;background:var(--surface);box-shadow:var(--shadow-soft);overflow:hidden;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;animation:cardIn .30s ease both}
    .select-card:hover{transform:translateY(-4px);border-color:var(--navy);box-shadow:var(--shadow)}
    .select-card:after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red);transform:scaleY(0);transform-origin:center;transition:transform .18s ease}
    .select-card:hover:after,.select-card.active:after{transform:scaleY(1)}
    .select-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--surface3);color:var(--navy);font-size:15px;font-weight:950;margin-bottom:13px}
    .select-title{font-size:15px;font-weight:900;color:var(--navy);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .select-sub{color:var(--muted);font-size:11px;line-height:1.45}
    .select-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
    .select-count{font-size:11px;font-weight:900;color:var(--text)}
    .select-arrow{color:var(--navy);font-weight:950;transition:transform .16s}
    .select-card:hover .select-arrow{transform:translateX(3px)}
    .record-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
    .generic-mobile{display:none}
    .record-card{padding:16px;animation:cardIn .26s ease both}
    .record-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .record-title{font-weight:900;color:var(--navy);font-size:14px}
    .record-id{font-size:9px;color:var(--muted);font-weight:800;margin-top:3px}
    .record-lines{display:grid;gap:5px;margin-top:12px}
    .record-line{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:6px;border-top:1px solid var(--line);font-size:10px}
    .record-line b{color:var(--muted);font-weight:800}
    .record-actions{display:flex;gap:6px;margin-top:13px;flex-wrap:wrap}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow-soft)}
    table{width:100%;border-collapse:collapse;min-width:820px;font-size:11px}
    th{position:sticky;top:0;z-index:1;background:var(--surface3);color:var(--navy);text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
    td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;max-width:280px;overflow-wrap:anywhere}
    tr:hover td{background:var(--surface2)}
    .actions{white-space:nowrap}
    .kpis{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px;margin-bottom:15px}
    .kpi{padding:16px}
    .kpi span{display:block;color:var(--muted);font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}
    .kpi strong{display:block;color:var(--navy);font-size:27px;margin-top:5px}
    .week-card{padding:18px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:18px;margin-bottom:15px}
    .week-big{font-size:20px;font-weight:950;color:var(--navy);margin:6px 0}
    .week-actions{display:flex;align-items:end;gap:7px}
    .intro{padding:18px}
    .intro h3{margin:0 0 6px;color:var(--navy)}
    .intro p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}
    .year-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
    .year-tab{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 12px;border-radius:999px;font-size:10px;font-weight:900;transition:.15s}
    .year-tab:hover,.year-tab.active{background:var(--navy);color:var(--surface);border-color:var(--navy);transform:translateY(-1px)}
    html[data-theme="dark"] .year-tab.active{color:#07111f}
    .day-groups{display:grid;gap:12px}
    .day-group{padding:15px}
    .day-group-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    .day-group-head h3{margin:0;color:var(--navy);font-size:14px}
    .day-items{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:9px}
    .dock-wrap{position:fixed;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));z-index:80;display:flex;justify-content:center;pointer-events:none;padding:0 10px}
    .dock{pointer-events:auto;max-width:calc(100vw - 20px);display:flex;align-items:flex-end;gap:5px;padding:8px 9px 7px;background:var(--dock);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(22px);box-shadow:0 18px 55px rgba(0,0,0,.17);overflow:visible}
    .dock-item{position:relative;width:55px;height:55px;border:0;border-radius:16px;background:var(--surface);color:var(--navy);display:flex;align-items:center;justify-content:center;flex:0 0 auto;transform-origin:center bottom;transition:transform .12s ease,background .16s ease,color .16s ease,box-shadow .16s ease;box-shadow:0 5px 13px rgba(11,47,107,.10)}
    .dock-item:hover{box-shadow:0 10px 22px rgba(11,47,107,.16)}
    .dock-item.active{background:var(--navy);color:var(--surface)}
    html[data-theme="dark"] .dock-item.active{color:#07111f}
    .dock-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;position:relative;background:linear-gradient(145deg,var(--surface2),var(--surface3));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 5px 12px rgba(11,47,107,.08);transition:transform .16s ease,box-shadow .16s ease,background .16s ease}.dock-icon svg{width:23px;height:23px;display:block;fill:none;stroke:currentColor;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}.dock-item:hover .dock-icon{transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.72),0 8px 18px rgba(11,47,107,.13)}.dock-item.active .dock-icon{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 18px rgba(0,0,0,.12)}html[data-theme="dark"] .dock-icon{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 5px 14px rgba(0,0,0,.18)}
    .dock-dot{position:absolute;width:5px;height:5px;border-radius:50%;bottom:-5px;background:var(--red);opacity:0;transition:.15s}
    .dock-item.active .dock-dot{opacity:1}
    .dock-tip{position:absolute;bottom:68px;left:50%;transform:translateX(-50%) translateY(5px);padding:5px 8px;border-radius:8px;background:var(--text);color:var(--surface);font-size:9px;font-weight:850;white-space:nowrap;opacity:0;pointer-events:none;transition:.14s}
    .dock-item:hover .dock-tip{opacity:1;transform:translateX(-50%) translateY(0)}
    .field label{display:block;font-size:10px;font-weight:900;color:var(--muted);margin-bottom:5px}
    .control{width:100%;border:1px solid var(--line);border-radius:11px;background:var(--surface);padding:9px 10px;outline:none}
    .control[readonly],.control:disabled{opacity:.72;background:var(--surface2)}
    textarea.control{min-height:92px;resize:vertical}
    .drawer-backdrop{position:fixed;inset:0;z-index:110;background:rgba(5,14,28,.52);backdrop-filter:blur(3px);animation:fade .16s}
    .drawer{position:absolute;right:0;top:0;height:100%;width:min(650px,94vw);background:var(--surface);box-shadow:-24px 0 70px rgba(0,0,0,.24);display:flex;flex-direction:column;animation:slide .22s ease}
    .drawer-head{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
    .drawer-head h3{margin:0;color:var(--navy)}
    .drawer-body{padding:18px;overflow:auto;flex:1}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
    .full{grid-column:1/-1}
    .drawer-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:var(--surface)}
    .empty,.loading,.error{padding:38px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:18px;color:var(--muted);animation:rise .22s ease}
    .error{color:var(--danger);border-color:rgba(180,35,59,.35);background:var(--surface)}
    .spinner{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .65s linear infinite;vertical-align:-3px;margin-right:6px}
    .toast{position:fixed;right:18px;top:18px;z-index:150;max-width:380px;padding:11px 14px;background:var(--text);color:var(--surface);border-radius:12px;font-size:11px;font-weight:850;box-shadow:0 16px 36px rgba(0,0,0,.2);animation:toastIn .22s ease}
    .toast.error{background:var(--danger);color:#fff}

    /* OVERVIEW PRINT ANALYTICS */
    .analytics-shell{display:grid;gap:14px;margin-bottom:15px}
    .analytics-filterbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 15px}
    .analytics-filtergroup{display:flex;align-items:flex-end;gap:9px;flex-wrap:wrap}
    .analytics-filtergroup .field{margin:0;min-width:170px}
    .analytics-filtergroup .field.date-field{min-width:155px}
    .segment{display:flex;align-items:center;gap:4px;padding:4px;background:var(--surface3);border:1px solid var(--line);border-radius:13px}
    .segment button{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:8px 11px;font-size:10px;font-weight:900}
    .segment button.active{background:var(--surface);color:var(--navy);box-shadow:var(--shadow-soft)}
    .date-nav{display:flex;align-items:center;gap:5px}
    .analytics-kpis{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px}
    .analytics-kpi{padding:16px;position:relative;overflow:hidden}
    .analytics-kpi:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--surface3)}
    .analytics-kpi.printed:after{background:var(--green)}
    .analytics-kpi.pending:after{background:var(--amber)}
    .analytics-kpi.rate:after{background:var(--navy)}
    .analytics-kpi .kpi-label{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}
    .analytics-kpi .kpi-value{display:block;color:var(--navy);font-size:30px;font-weight:950;margin-top:7px;letter-spacing:-.03em}
    .analytics-kpi .kpi-note{margin-top:4px;color:var(--muted);font-size:10px}
    .analytics-charts{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,.65fr);gap:12px}
    .analytics-chart-card{padding:16px;min-width:0}
    .chart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
    .chart-head h3{margin:0;color:var(--navy);font-size:14px}
    .chart-head p{margin:3px 0 0;color:var(--muted);font-size:10px;line-height:1.4}
    .chart-legend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:9px;font-weight:800}
    .legend-dot{width:7px;height:7px;border-radius:50%;display:inline-block}
    .legend-dot.printed{background:var(--green)}
    .legend-dot.pending{background:var(--amber)}
    .trend-wrap{width:100%;overflow:hidden}
    .trend-svg{display:block;width:100%;height:auto;min-height:230px}
    .trend-grid{stroke:var(--line);stroke-width:1}
    .trend-axis-text{fill:var(--muted);font-size:9px;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .trend-line{fill:none;stroke:var(--red);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .trend-point{fill:var(--surface);stroke:var(--red);stroke-width:2}
    .trend-area{fill:var(--red);opacity:.06}
    .comparison-chart{display:grid;gap:11px}
    .comparison-row{display:grid;grid-template-columns:minmax(100px,150px) minmax(100px,1fr) 58px;align-items:center;gap:9px}
    .comparison-label{font-size:10px;font-weight:850;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bar-track{height:10px;border-radius:999px;background:var(--surface3);overflow:hidden}
    .bar-fill{height:100%;border-radius:inherit;background:var(--navy);min-width:0}
    .comparison-value{text-align:right;color:var(--navy);font-size:10px;font-weight:950}
    .completion-list{display:grid;gap:12px}
    .completion-row{display:grid;gap:6px}
    .completion-top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:10px}
    .completion-top strong{color:var(--text);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .completion-top span{color:var(--muted);font-weight:850;white-space:nowrap}
    .completion-track{height:11px;background:var(--surface3);border-radius:999px;display:flex;overflow:hidden}
    .completion-printed{height:100%;background:var(--green)}
    .completion-pending{height:100%;background:var(--amber)}
    .analytics-empty{padding:26px;text-align:center;color:var(--muted);font-size:11px}
    .analytics-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:9px;margin-top:8px}
    .system-summary{margin-top:15px}
    .system-summary-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    .system-summary-title h3{margin:0;color:var(--navy);font-size:13px}

    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes fade{from{opacity:0}}
    @keyframes slide{from{transform:translateX(22px);opacity:.7}}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes toastIn{from{opacity:0;transform:translateY(-6px)}}
    @media(max-width:1000px){
      .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
      .analytics-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
      .analytics-charts{grid-template-columns:1fr}
      .selection-grid{grid-template-columns:repeat(auto-fit,minmax(185px,1fr))}
      .brand-copy span{display:none}
      .dock-item{width:51px;height:51px}
    }
    @media(max-width:700px){
      .generic-mobile{display:grid}
      .analytics-filterbar{align-items:stretch}
      .analytics-filtergroup{width:100%}
      .analytics-filtergroup .field{flex:1;min-width:140px}
      .segment{width:100%;display:grid;grid-template-columns:repeat(3,1fr)}
      .segment button{width:100%}
      .date-nav{width:100%}
      .date-nav .btn{flex:1}
      .analytics-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
      .analytics-chart-card{padding:13px}
      .comparison-row{grid-template-columns:minmax(90px,120px) minmax(80px,1fr) 48px}
      .generic-desktop{display:none}
      #root{padding-bottom:105px}

<script>
/* ============================================================
 * KIP GITHUB -> GOOGLE APPS SCRIPT doPost CLIENT
 * Edit only this URL after deploying Code.gs as a Web App.
 *
 * Transport:
 * GitHub page -> hidden HTML form POST -> GAS doPost(e)
 * -> hidden iframe response -> postMessage back to this page.
 * No CORS/XHR dependency and no additional frontend files.
 * ============================================================ */
const GAS_WEB_APP_URL = 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';

(function installKipGasDoPostClient(){
  'use strict';

  const REQUEST_TIMEOUT_MS = 60000;
  const pending = new Map();
  let sequence = 0;

  function backendUrl(){
    const value = String(GAS_WEB_APP_URL || '').trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec(?:\?.*)?$/i.test(value)) {
      throw new Error('Set GAS_WEB_APP_URL to your deployed Apps Script /exec URL.');
    }
    return value.split('?')[0];
  }

  function normalizeError(error){
    if (error instanceof Error) return error;
    const message = error && error.message
      ? String(error.message)
      : String(error || 'Unknown Apps Script error');
    const out = new Error(message);
    if (error && error.name) out.name = String(error.name);
    return out;
  }

  function randomNonce(){
    try {
      if (window.crypto && typeof window.crypto.getRandomValues === 'function') {
        const bytes = new Uint32Array(4);
        window.crypto.getRandomValues(bytes);
        return Array.from(bytes, value => value.toString(36)).join('');
      }
    } catch (_) {}
    return Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  function hiddenInput(name, value){
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = name;
    input.value = value == null ? '' : String(value);
    return input;
  }

  function cleanupTask(task){
    if (!task) return;
    clearTimeout(task.timer);
    if (task.form && task.form.parentNode) task.form.parentNode.removeChild(task.form);
    if (task.frame && task.frame.parentNode) task.frame.parentNode.removeChild(task.frame);
  }

  function rpc(method, args, success, failure, userObject){
    let url;
    try {
      url = backendUrl();
    } catch (error) {
      if (typeof failure === 'function') failure(normalizeError(error), userObject);
      return;
    }

    const id = 'kiprpc_' + Date.now().toString(36) + '_' + (++sequence).toString(36);
    const nonce = randomNonce();
    const frameName = 'kip_rpc_frame_' + id.replace(/[^A-Za-z0-9_]/g, '_');
    const mount = document.body || document.documentElement;

    const frame = document.createElement('iframe');
    frame.name = frameName;
    frame.title = 'KIP GAS Request';
    frame.setAttribute('aria-hidden', 'true');
    frame.tabIndex = -1;
    frame.style.cssText = 'position:fixed;width:1px;height:1px;left:-10000px;top:-10000px;border:0;opacity:0;pointer-events:none;';

    const form = document.createElement('form');
    form.method = 'POST';
    form.action = url;
    form.target = frameName;
    form.acceptCharset = 'UTF-8';
    form.style.display = 'none';
    form.appendChild(hiddenInput('kipRpc', '1'));
    form.appendChild(hiddenInput('method', String(method || '')));
    form.appendChild(hiddenInput('args', JSON.stringify(Array.isArray(args) ? args : [])));
    form.appendChild(hiddenInput('requestId', id));
    form.appendChild(hiddenInput('nonce', nonce));
    form.appendChild(hiddenInput('origin', window.location.origin));

    const timer = setTimeout(() => {
      const task = pending.get(id);
      if (!task) return;
      pending.delete(id);
      cleanupTask(task);
      const error = new Error(
        'Apps Script request timed out. Check GAS_WEB_APP_URL, the latest Web App deployment, and its access permission.'
      );
      if (typeof task.failure === 'function') task.failure(error, task.userObject);
    }, REQUEST_TIMEOUT_MS);

    const task = { id, nonce, frame, form, timer, success, failure, userObject };
    pending.set(id, task);

    try {
      mount.appendChild(frame);
      mount.appendChild(form);
      form.submit();
      // The form itself is no longer needed after the browser has submitted it.
      setTimeout(() => {
        if (form.parentNode) form.parentNode.removeChild(form);
      }, 0);
    } catch (error) {
      pending.delete(id);
      cleanupTask(task);
      if (typeof failure === 'function') failure(normalizeError(error), userObject);
    }
  }

  function createRunner(success, failure, userObject){
    return new Proxy({}, {
      get(_target, property){
        if (property === 'withSuccessHandler') {
          return function(handler){ return createRunner(handler, failure, userObject); };
        }
        if (property === 'withFailureHandler') {
          return function(handler){ return createRunner(success, handler, userObject); };
        }
        if (property === 'withUserObject') {
          return function(value){ return createRunner(success, failure, value); };
        }
        if (property === 'then') return undefined;
        return function(){
          rpc(
            String(property),
            Array.prototype.slice.call(arguments),
            function(result){
              if (typeof success === 'function') success(result, userObject);
            },
            function(error){
              if (typeof failure === 'function') failure(error, userObject);
            },
            userObject
          );
        };
      }
    });
  }

  window.addEventListener('message', function(event){
    const data = event.data || {};
    if (data.type !== 'KIP_GAS_RPC_RESULT' || !data.id || !data.nonce) return;

    const task = pending.get(String(data.id));
    if (!task) return;
    if (String(data.nonce) !== task.nonce) return;
    if (!task.frame || event.source !== task.frame.contentWindow) return;

    pending.delete(task.id);
    cleanupTask(task);

    if (data.ok) {
      if (typeof task.success === 'function') task.success(data.result, task.userObject);
    } else {
      const error = normalizeError(data.error || 'Apps Script request failed.');
      if (typeof task.failure === 'function') task.failure(error, task.userObject);
    }
  });

  window.google = window.google || {};
  window.google.script = window.google.script || {};
  Object.defineProperty(window.google.script, 'run', {
    configurable: true,
    get(){ return createRunner(null, null, null); }
  });
})();
</script>

    function isAuthError(message){

    function scriptRun(method,args,onSuccess,onFailure){
      if (!window.google || !google.script || !google.script.run) {
        onFailure(new Error('Google Apps Script doPost client is unavailable. Check GAS_WEB_APP_URL and the deployed Code.gs version.'));
        return;
      }
      var runner = google.script.run
        .withSuccessHandler(function(result){ if (onSuccess) onSuccess(result); })
        .withFailureHandler(function(error){ if (onFailure) onFailure(error); else handleFailure(error); });
      if (method === 'getAdminControlBootstrap') runner.getAdminControlBootstrap(args[0]);
      else if (method === 'getAdminCrudData') runner.getAdminCrudData(args[0],args[1]);
      else if (method === 'getAdminPrintingAnalytics') runner.getAdminPrintingAnalytics(args[0],args[1]);
      else if (method === 'setActiveWeek') runner.setActiveWeek(args[0],args[1]);
      else if (method === 'adminSaveRecord') runner.adminSaveRecord(args[0],args[1],args[2],args[3]);
      else if (method === 'adminDeleteRecord') runner.adminDeleteRecord(args[0],args[1],args[2]);
      else if (method === 'logoutStaff') runner.logoutStaff(args[0]);
      else onFailure(new Error('Unknown client method: ' + method));
    }

    function prettyDate(value){
      if (!value) return '-';
      var date = new Date(str(value).substring(0,10) + 'T00:00:00');
      if (isNaN(date.getTime())) return str(value);
      return date.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
    }
    function prettyDateFull(value){
      if (!value) return '-';
      var date = new Date(str(value).substring(0,10) + 'T00:00:00');
      if (isNaN(date.getTime())) return str(value);
      return date.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
    }
    function weekLabel(value){
      if (!value) return '-';
      var date = new Date(str(value).substring(0,10) + 'T00:00:00');
      if (isNaN(date.getTime())) return str(value);
      var end = new Date(date.getTime());
      end.setDate(date.getDate()+4);
      return date.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}) +
        ' - ' + end.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
    }
    function dateParts(value){
      if (!value) return {};
      var date = new Date(str(value).substring(0,10) + 'T00:00:00');
      if (isNaN(date.getTime())) return {};
      return {year:date.getFullYear(),month:date.getMonth(),day:date.getDate()};
    }
    function mondayKey(value){
      if (!value) return '';
      var date = new Date(str(value).substring(0,10) + 'T00:00:00');
      if (isNaN(date.getTime())) return '';
      var day = date.getDay();
      var diff = day === 0 ? -6 : 1-day;
      date.setDate(date.getDate()+diff);
      return date.getFullYear() + '-' +
        String(date.getMonth()+1).padStart(2,'0') + '-' +
        String(date.getDate()).padStart(2,'0');
    }
    function dayName(value){
      if (!value) return '';

    function uniqueValues(values){
      var seen = {};
      var out = [];
      var i,key;
      for (i=0;i<values.length;i++) {
        key = str(values[i]);

        if (!seen[key]) {

    }

    function bindShell(){

    function setupDockMagnification(){
      var dockEl = byId('macDock');
      if (!dockEl) return;
      try {
        if (window.matchMedia && window.matchMedia('(pointer:coarse)').matches) return;
      } catch (mediaError) {}
      var items = dockEl.querySelectorAll('.dock-item');
      dockEl.onmousemove = function(event){
        var i,rect,center,dist,power,scale,lift;
        for (i=0;i<items.length;i++) {
          rect = items[i].getBoundingClientRect();
          center = rect.left + rect.width/2;
          dist = Math.abs(event.clientX-center);
          power = Math.max(0,1-dist/105);
          scale = 1 + power*.34;
          lift = -power*13;
          items[i].style.transform = 'translateY(' + lift.toFixed(1) + 'px) scale(' + scale.toFixed(3) + ')';
        }
      };
      dockEl.onmouseleave = function(){
        var i;
        for (i=0;i<items.length;i++) items[i].style.transform = '';
      };
    }

      else if (section === 'Trainers') loadTrainers();
      else if (section === 'Classes') loadClasses();
      else if (section === 'Materials') loadMaterials();
      else if (section === 'Print_Plan') loadPrintPlans();
      else loadGeneric(section);
    }


    function analyticsToday(){
      var now = new Date();
      return now.getFullYear() + '-' +
        String(now.getMonth()+1).padStart(2,'0') + '-' +
        String(now.getDate()).padStart(2,'0');
    }

    function analyticsDateObject(value){
      var text = str(value || analyticsToday()).substring(0,10);
      var date = new Date(text + 'T00:00:00');
      if (isNaN(date.getTime())) date = new Date();
      date.setHours(0,0,0,0);
      return date;
    }

    function analyticsYmd(date){
      return date.getFullYear() + '-' +
        String(date.getMonth()+1).padStart(2,'0') + '-' +
        String(date.getDate()).padStart(2,'0');
    }

    function analyticsPeriodLabel(data){
      if (!data) return '';
      if (data.period === 'daily') return prettyDateFull(data.rangeStart);
      if (data.period === 'monthly') {
        var monthDate = analyticsDateObject(data.rangeStart);
        return monthDate.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
      }
      return prettyDateFull(data.rangeStart) + ' - ' + prettyDateFull(data.rangeEnd);
    }

    function bindAnalyticsControls(){
      var buttons = document.querySelectorAll('[data-analytics-period]');
      var i;
      for (i=0;i<buttons.length;i++) {
        buttons[i].onclick = function(){
          state.analyticsPeriod = this.getAttribute('data-analytics-period') || 'weekly';
          renderAnalyticsPeriodButtons();
          loadPrintingAnalytics();
        };
      }

      var branch = byId('analyticsBranch');
      if (branch) {
        branch.onchange = function(){
          state.analyticsBranchId = this.value || '';
          loadPrintingAnalytics();
        };
      }

      var date = byId('analyticsDate');
      if (date) {
        date.onchange = function(){
          state.analyticsDate = this.value || analyticsToday();
          loadPrintingAnalytics();
        };
      }

      var previous = byId('analyticsPrev');
      if (previous) previous.onclick = function(){ shiftAnalyticsDate(-1); };
      var next = byId('analyticsNext');
      if (next) next.onclick = function(){ shiftAnalyticsDate(1); };
      var today = byId('analyticsToday');
      if (today) today.onclick = function(){
        state.analyticsDate = analyticsToday();
        var input = byId('analyticsDate');
        if (input) input.value = state.analyticsDate;
        loadPrintingAnalytics();
      };
      var refresh = byId('analyticsRefresh');
      if (refresh) refresh.onclick = loadPrintingAnalytics;
    }

    function renderAnalyticsPeriodButtons(){
      var buttons = document.querySelectorAll('[data-analytics-period]');
      var i,period;
      for (i=0;i<buttons.length;i++) {
        period = buttons[i].getAttribute('data-analytics-period');
        if (period === state.analyticsPeriod) buttons[i].classList.add('active');
        else buttons[i].classList.remove('active');
      }
    }

    function shiftAnalyticsDate(direction){
      var date = analyticsDateObject(state.analyticsDate || analyticsToday());
      if (state.analyticsPeriod === 'monthly') {
        date.setDate(1);
        date.setMonth(date.getMonth() + direction);
      } else if (state.analyticsPeriod === 'weekly') {
        date.setDate(date.getDate() + (direction * 7));
      } else {
        date.setDate(date.getDate() + direction);
      }
      state.analyticsDate = analyticsYmd(date);
      var input = byId('analyticsDate');
      if (input) input.value = state.analyticsDate;
      loadPrintingAnalytics();
    }

    function populateAnalyticsBranches(options){
      var select = byId('analyticsBranch');
      if (!select) return;
      var html = '<option value="">All Branches</option>';
      var i,option;
      options = options || [];
      for (i=0;i<options.length;i++) {
        option = options[i];
        html += '<option value="' + attr(option.value) + '"' +
          (str(option.value) === str(state.analyticsBranchId) ? ' selected' : '') +
          '>' + esc(option.label) + '</option>';
      }
      select.innerHTML = html;
      select.value = state.analyticsBranchId || '';
    }

    function loadPrintingAnalytics(){
      var target = byId('analyticsContent');
      if (!target) return;
      var requestId = ++state.analyticsRequestId;
      target.innerHTML = '<div class="loading"><span class="spinner"></span>Loading printing analytics...</div>';

      var filters = {
        period: state.analyticsPeriod || 'weekly',
        anchorDate: state.analyticsDate || analyticsToday(),
        branchId: state.analyticsBranchId || ''
      };

      scriptRun('getAdminPrintingAnalytics',[state.token,filters],function(data){
        if (requestId !== state.analyticsRequestId) return;
        state.analytics = data || {};
        state.analyticsPeriod = state.analytics.period || state.analyticsPeriod;
        state.analyticsDate = state.analytics.anchorDate || state.analyticsDate;
        state.analyticsBranchId = state.analytics.branchId || '';
        populateAnalyticsBranches(state.analytics.branchOptions || []);
        var date = byId('analyticsDate');
        if (date) date.value = state.analyticsDate;
        renderAnalyticsPeriodButtons();
        renderPrintingAnalytics();
      },function(error){
        if (requestId !== state.analyticsRequestId) return;
        target.innerHTML =
          '<div class="error"><strong>Printing analytics could not load.</strong>' +
          '<div style="margin-top:6px">' + esc(errorText(error)) + '</div>' +
          '<button id="retryAnalytics" class="btn primary btn-sm" style="margin-top:10px" type="button">Retry</button></div>';
        var retry = byId('retryAnalytics');
        if (retry) retry.onclick = loadPrintingAnalytics;
      });
    }

    function analyticsLineChart(items){
      items = items || [];
      if (!items.length) return '<div class="analytics-empty">No printing activity in this period.</div>';

      var width = 760;
      var height = 260;
      var left = 45;
      var right = 18;
      var top = 18;
      var bottom = 42;
      var plotW = width-left-right;
      var plotH = height-top-bottom;
      var max = 0;
      var i,value;
      for (i=0;i<items.length;i++) {
        value = Number(items[i].printedCopies || 0);
        if (value > max) max = value;
      }
      if (max < 1) max = 1;

      var grid = '';
      var step;
      for (i=0;i<=4;i++) {
        var y = top + (plotH * i / 4);
        var axisValue = Math.round(max * (1 - i/4));
        grid += '<line class="trend-grid" x1="' + left + '" y1="' + y.toFixed(1) + '" x2="' + (width-right) + '" y2="' + y.toFixed(1) + '"></line>';
        grid += '<text class="trend-axis-text" x="' + (left-7) + '" y="' + (y+3).toFixed(1) + '" text-anchor="end">' + axisValue + '</text>';
      }

      var points = [];
      var circles = '';
      var labels = '';
      var labelEvery = items.length > 18 ? Math.ceil(items.length/8) : (items.length > 10 ? 2 : 1);

      for (i=0;i<items.length;i++) {
        var x = items.length === 1 ? left + plotW/2 : left + (plotW * i / (items.length-1));
        var copies = Number(items[i].printedCopies || 0);
        var pointY = top + plotH - (copies/max)*plotH;
        points.push(x.toFixed(1) + ',' + pointY.toFixed(1));
        circles += '<circle class="trend-point" cx="' + x.toFixed(1) + '" cy="' + pointY.toFixed(1) + '" r="4">' +
          '<title>' + esc(items[i].label) + ': ' + copies + ' copies · ' + Number(items[i].printedJobs || 0) + ' jobs</title></circle>';
        if (i % labelEvery === 0 || i === items.length-1) {
          labels += '<text class="trend-axis-text" x="' + x.toFixed(1) + '" y="' + (height-16) + '" text-anchor="middle">' + esc(items[i].label) + '</text>';
        }
      }

      var areaPoints = left + ',' + (top+plotH) + ' ' + points.join(' ') + ' ' + (width-right) + ',' + (top+plotH);

      return '<div class="trend-wrap"><svg class="trend-svg" viewBox="0 0 760 260" role="img" aria-label="Printed copies trend">' +
        grid +
        '<polygon class="trend-area" points="' + areaPoints + '"></polygon>' +
        '<polyline class="trend-line" points="' + points.join(' ') + '"></polyline>' +
        circles + labels +
        '</svg></div>';
    }

    function analyticsComparisonBars(items){
      items = items || [];
      if (!items.length) return '<div class="analytics-empty">No comparison data available.</div>';
      var max = 0;
      var i,value,html='';
      for (i=0;i<items.length;i++) {
        value = Number(items[i].printedCopies || 0);
        if (value > max) max = value;
      }
      if (max < 1) max = 1;
      for (i=0;i<items.length;i++) {
        value = Number(items[i].printedCopies || 0);
        var pct = Math.max(0,Math.min(100,(value/max)*100));
        html += '<div class="comparison-row">' +
          '<div class="comparison-label" title="' + attr(items[i].name) + '">' + esc(items[i].name) + '</div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + pct.toFixed(1) + '%"></div></div>' +
          '<div class="comparison-value">' + value + '</div></div>';
      }
      return '<div class="comparison-chart">' + html + '</div>';
    }

    function analyticsCompletionChart(items){
      items = items || [];
      if (!items.length) return '<div class="analytics-empty">No planned printing jobs in this period.</div>';
      var html = '';
      var i,item,total,printedPct,pendingPct;
      for (i=0;i<items.length;i++) {
        item = items[i];
        total = Number(item.requiredJobs || 0);
        printedPct = total ? (Number(item.completedJobs || 0)/total)*100 : 0;
        pendingPct = total ? (Number(item.pendingJobs || 0)/total)*100 : 0;
        html += '<div class="completion-row">' +
          '<div class="completion-top"><strong title="' + attr(item.name) + '">' + esc(item.name) + '</strong>' +
          '<span>' + Number(item.completedJobs || 0) + ' printed · ' + Number(item.pendingJobs || 0) + ' pending</span></div>' +
          '<div class="completion-track" title="' + attr(item.name + ': ' + Number(item.completionRate || 0) + '% complete') + '">' +
            '<div class="completion-printed" style="width:' + printedPct.toFixed(1) + '%"></div>' +
            '<div class="completion-pending" style="width:' + pendingPct.toFixed(1) + '%"></div>' +
          '</div></div>';
      }
      return '<div class="completion-list">' + html + '</div>';
    }

    function materialYears(){

    function renderPrintWeeks(year,month){

      var rows=state.crud?(state.crud.rows||[]):[];
      var weekValues=[],i,parts;
      for(i=0;i<rows.length;i++){parts=dateParts(rows[i].Date);if(parts.year===year&&parts.month===month)weekValues.push(mondayKey(rows[i].Date));}
      weekValues=uniqueValues(weekValues);weekValues.sort();weekValues.reverse();
      var cards='',w,j,row,count,copies,branchesSeen,branches;

    }

    function bindRecordButtons(scope){
      var edits=scope.querySelectorAll('.edit');
      var dels=scope.querySelectorAll('.del');
      var i;
      for(i=0;i<edits.length;i++)edits[i].onclick=function(){openEditorByKey(this.getAttribute('data-key'));};
      for(i=0;i<dels.length;i++)dels[i].onclick=function(){deleteRecord(this.getAttribute('data-key'));};
    }

    function openEditorByKey(key){
      var rows=state.crud?(state.crud.rows||[]):[];
      var i,row=null;
      for(i=0;i<rows.length;i++)if(str(rows[i].__key)===str(key)){row=rows[i];break;}
      openEditor(row,{});
    }

    function copyObject(source){
      var out={},key;
      if(!source)return out;
      for(key in source)if(Object.prototype.hasOwnProperty.call(source,key))out[key]=source[key];
      return out;
    }
    function mergeObjects(a,b,c){
      var out=copyObject(a),key,srcs=[b,c],i;
      for(i=0;i<srcs.length;i++){
        if(!srcs[i])continue;
        for(key in srcs[i])if(Object.prototype.hasOwnProperty.call(srcs[i],key))out[key]=srcs[i][key];
      }
      return out;
    }

    function defaults(){
      var week=state.boot&&state.boot.activeWeek?state.boot.activeWeek.weekStart:'';
      return {Active:'Active',Status:'Active',Role:'Material Maker',Print_Required:'No',Copies:0,Expected_Student:0,Week_Start:week,Date:week,Day:'Monday'};
    }

    function openEditor(row,prefill){
      var data=state.crud;
      if(!data)return;
      var isNew=!row;
      var rec=mergeObjects(defaults(),prefill,row);
      var backdrop=document.createElement('div');
      backdrop.id='drawer';
      backdrop.className='drawer-backdrop';
      backdrop.setAttribute('data-key',row?row.__key:'');
      var fields=data.fields||[];
      var fieldsHtml='',i;
      for(i=0;i<fields.length;i++)fieldsHtml+=fieldHtml(fields[i],rec[fields[i].name],isNew,rec);
      backdrop.innerHTML='<section class="drawer">'+
        '<div class="drawer-head"><h3>'+(isNew?'New ':'Edit ')+esc(str(data.entity).split('_').join(' '))+'</h3>'+
        '<button id="closeDrawer" class="btn soft btn-sm" type="button">X</button></div>'+
        '<div class="drawer-body"><div class="form-grid">'+fieldsHtml+'</div></div>'+
        '<div class="drawer-foot"><button id="cancelDrawer" class="btn outline" type="button">Cancel</button>'+
        '<button id="saveRecord" class="btn primary" type="button">Save Record</button></div></section>';
      document.body.appendChild(backdrop);
      byId('closeDrawer').onclick=closeEditor;
      byId('cancelDrawer').onclick=closeEditor;
      byId('saveRecord').onclick=saveRecord;
      backdrop.onclick=function(event){if(event.target===backdrop)closeEditor();};
      bindDependentFields();
    }

    function fieldHtml(field,value,isNew,rec){
      var data=state.crud;
      var val=value===null||value===undefined?'':value;
      var keys=data.keyFields||[];
      var isId=keys.indexOf(field.name)>=0&&data.entity!=='Print_Plan';
      var required;
      if(field.name==='Password')required=isNew;
      else required=!!field.required&&!(isNew&&isId);
      var hint='';
      if(isNew&&isId)hint=' <span class="meta">(auto if blank)</span>';
      else if(field.name==='Password'&&!isNew)hint=' <span class="meta">(blank keeps current)</span>';
      var control='',i,options,option,selected,type,lock;
      if(field.type==='select'||field.type==='relation'){
        options=fieldOptions(field,rec);
        control='<select class="control" data-field="'+attr(field.name)+'"'+(required?' required':'')+(field.readonly?' disabled':'')+'>';
        for(i=0;i<options.length;i++){
          option=options[i];
          selected=str(option.value)===str(val)?' selected':'';
          control+='<option value="'+attr(option.value)+'"'+selected+'>'+esc(option.label)+'</option>';
        }
        control+='</select>';
      }else if(field.type==='textarea'){
        control='<textarea class="control" data-field="'+attr(field.name)+'"'+(required?' required':'')+'>'+esc(val)+'</textarea>';
      }else{
        type=field.type==='datetime'?'datetime-local':field.type;
        lock=isId&&!isNew;
        control='<input class="control" data-field="'+attr(field.name)+'" type="'+attr(type)+'" value="'+attr(field.name==='Password'?'':val)+'"'+
          (required?' required':'')+((field.readonly||lock)?' readonly':'')+'>';
      }
      return '<div class="field '+(field.type==='textarea'?'full':'')+'"><label>'+esc(field.label)+hint+'</label>'+control+'</div>';
    }

    function fieldOptions(field,rec){
      var data=state.crud;
      var out=[],base,i,row,allowed={};
      if(field.type==='select'){
        base=field.options||[];
        for(i=0;i<base.length;i++)out.push({value:base[i],label:base[i]||'-'});
        return out;
      }
      base=(data.options&&data.options[field.source])?data.options[field.source]:[];
      for(i=0;i<base.length;i++)out.push({value:base[i].value,label:base[i].label});

      if(data.entity==='Classes'&&field.name==='Trainer_ID'){
        var branch=rec.Branch_ID||state.context.branchId||'';
        allowed={};
        var trainerRows=state.aux.trainers?(state.aux.trainers.rows||[]):[];
        for(i=0;i<trainerRows.length;i++)if(!branch||str(trainerRows[i].Branch_ID)===str(branch))allowed[str(trainerRows[i].Trainer_ID)]=true;
        out=filterOptions(out,allowed);
      }
      if(data.entity==='Print_Plan'&&field.name==='Trainer_ID'&&state.context.branchId){
        allowed={};
        var tRows=state.aux.trainers?(state.aux.trainers.rows||[]):[];
        for(i=0;i<tRows.length;i++)if(str(tRows[i].Branch_ID)===str(state.context.branchId))allowed[str(tRows[i].Trainer_ID)]=true;
        out=filterOptions(out,allowed);
      }
      if(data.entity==='Print_Plan'&&field.name==='Class_ID'){
        var trainer=rec.Trainer_ID||state.context.trainerId||'';
        allowed={};
        var classRows=state.aux.classes?(state.aux.classes.rows||[]):[];
        for(i=0;i<classRows.length;i++){
          row=classRows[i];
          if(state.context.branchId&&str(row.Branch_ID)!==str(state.context.branchId))continue;
          if(trainer&&str(row.Trainer_ID)!==str(trainer))continue;
          allowed[str(row.Class_ID)]=true;
        }
        out=filterOptions(out,allowed);
      }
      out.unshift({value:'',label:'Select...'});
      return out;
    }

    function filterOptions(options,allowed){
      var out=[],i;
      for(i=0;i<options.length;i++)if(allowed[str(options[i].value)])out.push(options[i]);
      return out;
    }

    function bindDependentFields(){
      if(state.entity==='Classes'){
        var branch= document.querySelector('[data-field="Branch_ID"]');
        var trainer=document.querySelector('[data-field="Trainer_ID"]');
        if(branch&&trainer){
          branch.onchange=function(){
            var rows=state.aux.trainers?(state.aux.trainers.rows||[]):[];
            var ids=[],i;
            for(i=0;i<rows.length;i++)if(str(rows[i].Branch_ID)===str(branch.value))ids.push(rows[i].Trainer_ID);
            refillRelation(trainer,'trainers',ids);
          };
        }
      }
      if(state.entity==='Print_Plan'){
        var trainerSelect=document.querySelector('[data-field="Trainer_ID"]');
        var classSelect=document.querySelector('[data-field="Class_ID"]');
        if(trainerSelect&&classSelect){
          trainerSelect.onchange=function(){
            var rows=state.aux.classes?(state.aux.classes.rows||[]):[];
            var ids=[],i,row;
            for(i=0;i<rows.length;i++){
              row=rows[i];
              if(state.context.branchId&&str(row.Branch_ID)!==str(state.context.branchId))continue;
              if(trainerSelect.value&&str(row.Trainer_ID)!==str(trainerSelect.value))continue;
              ids.push(row.Class_ID);
            }
            refillRelation(classSelect,'classes',ids);
          };
        }
      }
    }

    function refillRelation(select,source,allowedIds){
      var current=select.value;
      var allowed={},i;
      for(i=0;i<allowedIds.length;i++)allowed[str(allowedIds[i])]=true;
      var options=state.crud&&state.crud.options?state.crud.options[source]:[];
      var html='<option value="">Select...</option>';
      for(i=0;i<options.length;i++){
        if(allowed[str(options[i].value)])html+='<option value="'+attr(options[i].value)+'">'+esc(options[i].label)+'</option>';
      }
      select.innerHTML=html;
      if(allowed[str(current)])select.value=current;
    }

    function closeEditor(){
      var drawer=byId('drawer');
      if(drawer&&drawer.parentNode)drawer.parentNode.removeChild(drawer);
    }

    function saveRecord(){
      var backdrop=byId('drawer');
      var button=byId('saveRecord');
      if(!backdrop||!state.crud)return;
      var inputs=backdrop.querySelectorAll('[data-field]');
      var record={},i,input;
      for(i=0;i<inputs.length;i++){
        input=inputs[i];
        if(input.required&&!str(input.value).trim()){
          input.focus();
          toast('Complete all required fields.',true);
          return;
        }
        record[input.getAttribute('data-field')]=input.value;
      }
      busy(button,true,'Saving...');
      scriptRun('adminSaveRecord',[state.token,state.entity,record,backdrop.getAttribute('data-key')||''],function(result){
        if(result&&result.created&&state.boot&&state.boot.counts){
          state.boot.counts[state.entity]=(state.boot.counts[state.entity]||0)+1;
        }
        closeEditor();
        toast('Record saved.',false);
        refreshCurrentView();
      },function(error){
        busy(button,false,'Save Record');
        toast(errorText(error),true);
      });
    }

    function deleteRecord(key){
      if(!window.confirm('Delete this record? This changes the spreadsheet immediately.'))return;
      scriptRun('adminDeleteRecord',[state.token,state.entity,key],function(){
        if(state.boot&&state.boot.counts)state.boot.counts[state.entity]=Math.max(0,(state.boot.counts[state.entity]||0)-1);
        toast('Record deleted.',false);
        refreshCurrentView();
      },function(error){toast(errorText(error),true);});
    }

    function refreshCurrentView(){
      var section=state.section;
      var view=state.view;
      var ctx=copyObject(state.context);
      if(section==='Branches'||section==='Levels'||section==='Users'){
        fetchCrud(section,function(data){state.crud=data;renderGeneric();},handleFailure);
        return;
      }
      if(section==='Trainers'){
        fetchCrud('Trainers',function(data){
          state.crud=data;
          if(view==='trainers'&&ctx.branchId)renderTrainersForBranch(ctx.branchId);else renderTrainerBranches();
        },handleFailure);
        return;
      }
      if(section==='Classes'){
        fetchCrud('Classes',function(classesData){
          state.crud=classesData;
          fetchCrud('Trainers',function(trainerData){
            state.aux.trainers=trainerData;
            if(view==='classes'&&ctx.branchId&&ctx.trainerId)renderClassesForTrainer(ctx.branchId,ctx.trainerId);
            else if(view==='trainer'&&ctx.branchId)renderClassTrainerGrid(ctx.branchId);
            else renderClassBranches();
          },handleFailure);
        },handleFailure);
        return;
      }
      if(section==='Materials'){
        fetchCrud('Materials',function(data){
          state.crud=data;
          if(view==='records'&&ctx.week&&ctx.levelId)renderMaterialRecords(ctx.year,ctx.month,ctx.week,ctx.levelId);
          else if(view==='level'&&ctx.week)renderMaterialLevels(ctx.year,ctx.month,ctx.week);
          else if(view==='week'&&typeof ctx.month==='number')renderMaterialWeeks(ctx.year,ctx.month);
          else renderMaterialMonths(ctx.year);
        },handleFailure);
        return;
      }
      if(section==='Print_Plan'){
        fetchCrud('Print_Plan',function(plansData){
          state.crud=plansData;
          fetchCrud('Classes',function(classesData){
            state.aux.classes=classesData;
            fetchCrud('Trainers',function(trainersData){
              state.aux.trainers=trainersData;
              if(view==='records'&&ctx.week&&ctx.branchId&&ctx.trainerId)renderPrintRecords(ctx.year,ctx.month,ctx.week,ctx.branchId,ctx.trainerId);
              else if(view==='trainer'&&ctx.week&&ctx.branchId)renderPrintTrainers(ctx.year,ctx.month,ctx.week,ctx.branchId);
              else if(view==='branch'&&ctx.week)renderPrintBranches(ctx.year,ctx.month,ctx.week);
              else if(view==='week'&&typeof ctx.month==='number')renderPrintWeeks(ctx.year,ctx.month);
              else renderPrintMonths(ctx.year);
            },handleFailure);
          },handleFailure);
        },handleFailure);
      }
    }

    function crumbs(items){
      var html='<div class="breadcrumbs">';
      var i,item;
      for(i=0;i<items.length;i++){
        item=items[i];
        if(i)html+='<span class="crumb-sep">&rsaquo;</span>';
        html+='<button type="button" class="crumb '+(item.action?'':'current')+'"'+(item.action?' data-crumb="'+attr(item.action)+'"':'')+'>'+esc(item.label)+'</button>';
      }
      html+='</div>';
      return html;
    }

    document.addEventListener('click',function(event){
      var node=event.target;
      while(node&&node!==document&&!node.getAttribute('data-crumb'))node=node.parentNode;
      if(!node||node===document)return;
      var action=node.getAttribute('data-crumb');
      if(action==='trainerRoot')renderTrainerBranches();
      else if(action==='classRoot')renderClassBranches();
      else if(action==='classBranch')renderClassTrainerGrid(state.context.branchId);
      else if(action==='materialRoot')renderMaterialMonths();
      else if(action==='materialMonth')renderMaterialMonths(state.context.year);
      else if(action==='materialWeek')renderMaterialWeeks(state.context.year,state.context.month);
      else if(action==='printRoot')renderPrintMonths();
      else if(action==='printMonth')renderPrintMonths(state.context.year);
      else if(action==='printWeek')renderPrintWeeks(state.context.year,state.context.month);
      else if(action==='printBranch')renderPrintBranches(state.context.year,state.context.month,state.context.week);
    });

    function yearTabs(years,active,kind){
      var html='<div class="year-tabs">',i;
      for(i=0;i<years.length;i++){
        html+='<button type="button" class="year-tab '+(Number(years[i])===Number(active)?'active':'')+'" data-year-kind="'+attr(kind)+'" data-year="'+attr(years[i])+'">'+esc(years[i])+'</button>';
      }
      return html+'</div>';
    }
    function bindYearTabs(kind,handler){
      var buttons=document.querySelectorAll('[data-year-kind="'+kind+'"]');
      var i;
      for(i=0;i<buttons.length;i++)buttons[i].onclick=function(){handler(Number(this.getAttribute('data-year')));};
    }

    function displayValue(field,value){
      if(field.name==='Password')return '******';
      if(value===true)return 'Active';
      if(value===false)return 'Inactive';
      return value===null||value===undefined?'':value;
    }
    function cellHtml(field,value){
      var display=displayValue(field,value);
      if(field.type==='url'&&isHttpUrl(display))return '<a class="link" href="'+attr(display)+'" target="_blank" rel="noopener noreferrer">Open link</a>';
      if((field.name==='Active'||field.name==='Status')&&display)return statusBadge(display);
      return esc(display===''?'-':display);
    }
    function tableAndCards(rows,fields){
      var table='<div class="table-wrap generic-desktop"><table><thead><tr>',i,j,row;
      for(i=0;i<fields.length;i++)table+='<th>'+esc(fields[i].label)+'</th>';
      table+='<th>Actions</th></tr></thead><tbody>';
      for(i=0;i<rows.length;i++){
        row=rows[i];table+='<tr>';
        for(j=0;j<fields.length;j++)table+='<td>'+cellHtml(fields[j],row[fields[j].name])+'</td>';
        table+='<td class="actions"><button class="btn soft btn-sm edit" data-key="'+attr(row.__key)+'" type="button">Edit</button> '+
          '<button class="btn danger btn-sm del" data-key="'+attr(row.__key)+'" type="button">Delete</button></td></tr>';
      }
      table+='</tbody></table></div><div class="record-grid generic-mobile" style="margin-top:12px">';
      for(i=0;i<rows.length;i++){
        row=rows[i];table+='<article class="card record-card">';
        for(j=0;j<fields.length&&j<5;j++){
          if(j===0)table+='<div class="record-title">'+cellHtml(fields[j],row[fields[j].name])+'</div>';
          else table+='<div class="record-line"><b>'+esc(fields[j].label)+'</b><span>'+cellHtml(fields[j],row[fields[j].name])+'</span></div>';
        }
        table+='<div class="record-actions"><button class="btn soft btn-sm edit" data-key="'+attr(row.__key)+'" type="button">Edit</button>'+
          '<button class="btn danger btn-sm del" data-key="'+attr(row.__key)+'" type="button">Delete</button></div></article>';
      }
      return table+'</div>';
    }

    document.addEventListener('DOMContentLoaded',loadBootstrap);
  })();
  </script>
</body>
</html>
